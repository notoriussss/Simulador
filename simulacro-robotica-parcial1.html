<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{margin:0}</style>
<title>Simulacro Robótica</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: una sola columna tipo hoja de examen. Inicio = ajustes + 12 modelos; examen = hoja con barra fija; resultado = nota, análisis de riesgo y revisión. */
:root{
  --bg:#eef1f6; --paper:#ffffff; --ink:#101a30; --muted:#566178; --line:#d3dae6;
  --accent:#1f4fd8; --accent-ink:#ffffff; --sel:#e4ebff;
  --ok:#17803d; --ok-bg:#e1f3e7; --bad:#b42318; --bad-bg:#fcebe9; --warn:#8a5200; --warn-bg:#fff0d0;
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1222; --paper:#131c32; --ink:#e7ecf8; --muted:#9aa7c4; --line:#27334f;
  --accent:#86a8ff; --accent-ink:#0b1222; --sel:#1b2a54;
  --ok:#62d28d; --ok-bg:#123020; --bad:#ff8f85; --bad-bg:#3b1815; --warn:#f2bd5e; --warn-bg:#382b0e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1222; --paper:#131c32; --ink:#e7ecf8; --muted:#9aa7c4; --line:#27334f;
  --accent:#86a8ff; --accent-ink:#0b1222; --sel:#1b2a54;
  --ok:#62d28d; --ok-bg:#123020; --bad:#ff8f85; --bad-bg:#3b1815; --warn:#f2bd5e; --warn-bg:#382b0e; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.wrap{max-width:880px;margin:0 auto;padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.15}
.mono{font-family:var(--f-mono)}
.label{font:500 11px/1 var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}

/* inicio */
.hero{padding:8px 0 22px}
.hero h1{font-size:clamp(28px,6vw,40px);letter-spacing:-.01em}
.hero p{margin:8px 0 0;max-width:62ch;color:var(--muted)}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:none;padding:7px 14px;font:500 13px var(--f-mono)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.topics{display:flex;flex-wrap:wrap;gap:8px}
.topics label{display:inline-flex;gap:7px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;user-select:none}
.topics input{accent-color:var(--accent);margin:0}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:9px 16px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
h2{font-size:20px;margin:28px 0 12px}
.models{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.model{text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:6px}
.model:hover{border-color:var(--accent)}
.model b{font:700 30px/1 var(--f-display)}
.model small{color:var(--muted);font-size:13px}
.model .best{font:500 12px var(--f-mono)}
.model .best.has{color:var(--ok)}

/* examen */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.prog{flex:1;min-width:130px;display:grid;gap:4px}
.prog span{font:500 12px var(--f-mono);color:var(--muted)}
.prog i{display:block;height:5px;border-radius:3px;background:var(--line);position:relative;overflow:hidden}
.prog i::after{content:"";position:absolute;inset:0 auto 0 0;width:var(--w,0%);background:var(--accent);transition:width .2s}
.paper{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:clamp(16px,4vw,32px);margin-top:8px}
.sheet-h{border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:6px;display:grid;gap:4px}
.sheet-h small{font:500 12px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sheet-h b{font:700 20px var(--f-display)}
.qs{list-style:none;margin:0;padding:0}
.q{padding:18px 0;border-bottom:1px solid var(--line);display:grid;gap:10px}
.qt{margin:0;font-weight:500;display:grid;grid-template-columns:2.2ch 1fr;gap:8px}
.qt .qn{font:600 15px var(--f-mono);color:var(--muted)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding-left:calc(2.2ch + 8px)}
.opt{display:grid;grid-template-columns:auto 1fr;gap:8px;text-align:left;border:1px solid var(--line);background:none;border-radius:8px;padding:9px 11px;min-width:0}
.opt .n{font:500 13px/1.5 var(--f-mono);color:var(--muted)}
.opt:hover{border-color:var(--accent)}
.opt.on{background:var(--sel);border-color:var(--accent)}
.opt.on .n{color:var(--accent)}
.conf{display:flex;gap:6px;flex-wrap:wrap;padding-left:calc(2.2ch + 8px)}
.chip{border:1px solid var(--line);background:none;border-radius:999px;padding:3px 11px;font-size:12px;color:var(--muted)}
.chip.on{color:var(--ink);border-color:var(--ink);font-weight:600}
.chip.on.d{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.note{margin:16px 0 0;font:600 13px var(--f-body)}

/* resultado */
.score{display:grid;gap:14px}
.big{font:700 clamp(44px,12vw,72px)/1 var(--f-display);letter-spacing:-.02em}
.big small{font-size:.4em;color:var(--muted);font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.tile{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:3px}
.tile b{font:600 22px var(--f-display)}
.tile.ok b{color:var(--ok)} .tile.bad b{color:var(--bad)}
.tile small{color:var(--muted);font-size:12px}
.risk{display:grid;gap:8px}
.risk p{margin:0;max-width:70ch}
.callout{border-radius:8px;padding:10px 12px;background:var(--warn-bg);color:var(--warn);font-weight:500}
.callout.good{background:var(--ok-bg);color:var(--ok)}
.rv{padding:16px 0;border-bottom:1px solid var(--line);display:grid;gap:8px}
.rv-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tag{font:500 11px var(--f-mono);border:1px solid var(--line);border-radius:4px;padding:2px 6px;color:var(--muted)}
.st{font:600 12px var(--f-mono);border-radius:4px;padding:2px 7px}
.st.ok{background:var(--ok-bg);color:var(--ok)} .st.bad{background:var(--bad-bg);color:var(--bad)} .st.blank{background:var(--line);color:var(--muted)}
.ro{display:grid;grid-template-columns:auto 1fr;gap:8px;border:1px solid var(--line);border-radius:8px;padding:7px 11px;min-width:0}
.ro .n{font:500 13px/1.5 var(--f-mono);color:var(--muted)}
.ro.right{background:var(--ok-bg);border-color:var(--ok)}
.ro.wrong{background:var(--bad-bg);border-color:var(--bad)}
.why{margin:0;color:var(--muted);font-size:14px;padding-left:calc(2.2ch + 8px)}

@media (max-width:560px){.opts,.conf,.why{padding-left:0}.opts{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.prog i::after{transition:none}}
</style>

<div class="wrap" id="app"></div>

<script>

const TOPICS=[
  {k:'H',n:'Historia y origen'},{k:'D',n:'Definiciones y clasificación'},{k:'L',n:'Locomoción y cinemática'},

const BANK=[
// ---------- H: historia y origen (12)
['H','La palabra «robot» proviene del vocablo checo «robota», que significa:','Labor o trabajo','Máquina inteligente','Movimiento espontáneo','Ser animado','«Robota» es labor o trabajo y «robotnik» es trabajador.'],

['H','En el siglo I, Herón de Alejandría diseñó dispositivos que actuaban en función de:','Agua, chorros de vapor y equilibrios de pesos','Electricidad y motores','Resortes y relojería','Señales de radio',''],
['H','En 1948 Goertz desarrolló un manipulador maestro-esclavo, con lo que aparece el concepto de:','Teleoperación','Control numérico','Robot móvil','Reprogramación','Control numérico es del MIT en 1952.'],
['H','El primer robot programable, desarrollado por Devol en 1954, se llamó:','Dispositivo de transferencia articulada programado','Unimate','PUMA','Shakey','Unimate es el robot instalado en 1959 en General Motors.'],
['H','En 1959 se instaló un robot Unimate en una fábrica de:','General Motors','ASEA','Cincinnati Milacron','Honda',''],
['H','El lenguaje comercial de robots VAL surgió de la fusión de los lenguajes:','WAVE y AL','AL y PUMA','WAVE y T3','IR6 y AL','WAVE (1973) y AL (1974) dieron origen a VAL.'],
['H','En 1898 Tesla construyó un antecedente de la teleoperación, que fue un:','Barco teleoperado','Brazo robótico','Robot humanoide','Autómata parlante',''],
['H','Las «tortugas electrónicas» fototropistas y programables fueron creadas en 1949 por:','W. Grey Walter','Nikola Tesla','Goertz','Herón de Alejandría',''],
// ---------- D: definiciones y clasificación (20)
['D','«Agente activo artificial cuyo ambiente es el mundo físico» es la definición de robot de:','Russell y Norvig','Webster','Jones y Flynn','Sucar',''],
['D','«Conexión inteligente de percepción a acción» es la definición de robot de:','Jones y Flynn','Russell y Norvig','Webster','Sucar',''],
['D','«Una máquina programable capaz de percibir y actuar en el mundo con cierta autonomía» es la definición de:','Sucar','Webster','Russell y Norvig','Jones y Flynn',''],
['D','La norma ISO 8373 define un robot industrial como un manipulador programable, reprogramable y multipropósito en:','Tres o más ejes','Dos ejes','Un solo eje','Exactamente cuatro ejes',''],

['D','Según ISO 8373, capaz de adaptarse a diferentes aplicaciones con alteraciones físicas o en el sistema de control:','Multifuncional','Reprogramable','Manipulador','Autónomo',''],
['D','Mecanismo formado por segmentos y uniones para mover objetos, normalmente en varios grados de libertad:','Manipulador','Actuador','Eslabón','Efector',''],
['D','Un robot móvil con capacidad de manipulación se clasifica como robot:','Híbrido','Manipulador','Teleoperado','Industrial','Categorías: manipuladores (brazos), móviles e híbridos (móviles con manipulación).'],
['D','Según Knasel, la primera generación de robots (1960) corresponde a:','Selección y colocación con manipuladores','Servocontrol con trayectoria programada','Móviles con inteligencia y vida artificial','Espaciales y militares',''],
['D','Según Knasel, los robots móviles que usan técnicas de inteligencia y vida artificial corresponden a la generación de:','1985','1960','1975','1995',''],

['D','Robot que opera de manera semi o totalmente autónoma para realizar servicios útiles, excluidas las operaciones de manufactura:','Robot de servicio','Robot industrial','Telemanipulador','Robot híbrido','Definición de la Federación Internacional de Robótica.'],

['D','Tipo de control en el que el robot es operado de modo remoto por un operador humano:','Teleoperado','Adaptativo','Secuencia controlada','Trayectoria continua',''],
['D','Un control adaptativo es «por aprendizaje» cuando:','La experiencia de ciclos anteriores cambia los parámetros o algoritmos de control','El movimiento se ajusta según las lecturas de sensores','Los movimientos siguen un orden fijo','Un operador lo maneja a distancia','Si se ajusta con lecturas de sensores se llama sensorial.'],

['L','Por su simetría, la forma de robot más fácil de navegar es la:','Cilíndrica','Cuadrada','Rectangular','Triangular','En un robot cuadrado la navegación depende de la orientación.'],

['L','Los robots sin partes móviles diferenciadas, que imitan serpientes o gusanos, se denominan:','Ápodos','Bípedos','Híbridos','Omnidireccionales',''],

// ---------- utilidades
const $app=document.getElementById('app');
function rng(s){let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19}let a=h;
  return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuf(arr,r=Math.random){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const KEY='simulacro-robotica-p1';
let S={factor:2,topics:TOPICS.map(t=>t.k),best:{}};
try{Object.assign(S,JSON.parse(localStorage.getItem(KEY))||{})}catch(e){}
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const topicName=k=>TOPICS.find(t=>t.k===k).n;

// 12 modelos fijos: cada pregunta del banco sale en un solo modelo; cada tema se reparte entre todos.
const M=Math.floor(BANK.length/10);
const LETTERS='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
const flat=TOPICS.flatMap(t=>shuf(BANK.map((b,i)=>i).filter(i=>BANK[i][0]===t.k),rng('t'+t.k)));
const MODELS=Array.from({length:M},(_,m)=>shuf(flat.filter((_,i)=>i%M===m),rng('m'+m)));

function mkQs(ids,seed){
  return ids.map(id=>{const b=BANK[id];
    const opts=shuf([b[2],b[3],b[4],b[5]],seed?rng(seed+id):Math.random);
    return{t:b[0],q:b[1],opts,c:opts.indexOf(b[2]),e:b[6]}});
}

// ---------- vistas
let cur=null;

function home(){
  cur=null;
  const n=S.topics.length;
  $app.innerHTML=`
  <section class="hero">
    <span class="label">Robótica · Parcial 1</span>
    <h1>Simulacro de examen</h1>
    <p>Formato del profesor: 10 preguntas de selección simple, 4 opciones, 2 puntos cada una y factor de corrección por respuesta incorrecta. Salen todas las preguntas de tu resumen, repartidas en ${M} modelos.</p>
  </section>
  <div class="panel">
    <div class="row">
      <div><div class="label" style="margin-bottom:8px">Factor de corrección</div>
        <div class="seg" role="group" aria-label="Factor de corrección">
          <button data-act="factor" data-v="2" aria-pressed="${S.factor===2}">−2 pts</button>
          <button data-act="factor" data-v="1" aria-pressed="${S.factor===1}">−1 pto</button>
        </div></div>
      <button class="btn primary" data-act="random" ${n?'':'disabled'}>Generar parcial aleatorio</button>
    </div>
    <div><div class="label" style="margin-bottom:8px">Temas del parcial aleatorio</div>
      <div class="topics">${TOPICS.map(t=>`<label for="tp-${t.k}"><input type="checkbox" id="tp-${t.k}" data-act="topic" data-v="${t.k}" ${S.topics.includes(t.k)?'checked':''}>${t.n}</label>`).join('')}</div></div>
  </div>
  <h2>Modelos fijos</h2>
  <div class="models">${MODELS.map((_,m)=>{const b=S.best[m];
    return`<button class="model" data-act="model" data-v="${m}"><b>${LETTERS[m]}</b><small>Modelo ${LETTERS[m]} · ${MODELS[m].length} preguntas</small>
    <span class="best ${b?'has':''}">${b?`mejor ${b.score}/${b.total} (−${b.factor})`:'sin intentar'}</span></button>`}).join('')}</div>`;
  scrollTo(0,0);
}

function start(key,title,qs){
  cur={key,title,qs,ans:qs.map(()=>null),conf:qs.map(()=>'s')};
  $app.innerHTML=`
  <div class="bar">
    <button class="btn" data-act="home">Salir</button>
    <div class="prog"><span id="pt"></span><i id="pb"></i></div>
    <button class="btn primary" data-act="grade">Corregir parcial</button>
  </div>
  <article class="paper">
    <header class="sheet-h"><small>Universidad Católica Andrés Bello</small><b>Robótica · Examen Parcial 1 · ${title}</b></header>
    <ol class="qs">${qs.map((_,i)=>qHtml(i)).join('')}</ol>
    <p class="note">2 ptos C/U. Para respuestas incorrectas el factor de corrección es −${S.factor} ${S.factor===1?'pto':'ptos'}.</p>
  </article>`;
  prog();scrollTo(0,0);
}

function qHtml(i){
  const q=cur.qs[i],a=cur.ans[i],c=cur.conf[i];
  return`<li class="q" id="q${i}"><p class="qt"><span class="qn">${i+1}.</span><span>${q.q}</span></p>
  <div class="opts">${q.opts.map((o,j)=>`<button class="opt${a===j?' on':''}" data-act="pick" data-i="${i}" data-j="${j}" aria-pressed="${a===j}"><span class="n">[ ${j+1} ]</span><span>${o}</span></button>`).join('')}</div>
  <div class="conf">
    <button class="chip${a!=null&&c==='s'?' on':''}" data-act="conf" data-i="${i}" data-v="s">Seguro</button>
    <button class="chip d${a!=null&&c==='d'?' on':''}" data-act="conf" data-i="${i}" data-v="d">Dudo</button>
    <button class="chip${a==null?' on':''}" data-act="blank" data-i="${i}">Dejar en blanco</button>
  </div></li>`;
}
function redraw(i){document.getElementById('q'+i).outerHTML=qHtml(i);prog()}
function prog(){const n=cur.ans.filter(a=>a!=null).length,t=cur.qs.length;
  document.getElementById('pt').textContent=`${n}/${t} respondidas · ${t-n} en blanco`;
  document.getElementById('pb').style.setProperty('--w',(n/t*100)+'%')}

function grade(){
  const f=S.factor,qs=cur.qs;
  let ok=0,bad=0,blank=0,dNet=0;const sure={n:0,ok:0},doubt={n:0,ok:0},miss={};
  qs.forEach((q,i)=>{const a=cur.ans[i];if(a==null){blank++;return}
    const hit=a===q.c,g=cur.conf[i]==='d'?doubt:sure;
    hit?ok++:(bad++,miss[q.t]=(miss[q.t]||0)+1);g.n++;if(hit)g.ok++;
    if(cur.conf[i]==='d')dNet+=hit?2:-f});
  const total=qs.length*2,score=2*ok-f*bad;
  if(typeof cur.key==='number'){const b=S.best[cur.key];if(!b||score>b.score){S.best[cur.key]={score,total,factor:f};persist()}}
  const th=Math.round(f/(2+f)*100);
  const pct=g=>g.n?Math.round(g.ok/g.n*100)+' %':'—';
  let verdict;
  if(!doubt.n)verdict=`<div class="callout good">No marcaste ninguna como «Dudo». Revisa abajo cuáles de tus «Seguro» fallaron.</div>`;
  else if(dNet>0)verdict=`<div class="callout good">Arriesgar en las dudosas te sumó +${dNet} pts. Con tu nivel de acierto en ellas (${pct(doubt)}) valió la pena.</div>`;
  else if(dNet<0)verdict=`<div class="callout">Dejar en blanco las dudosas te habría dado +${-dNet} pts: tu nota habría sido ${score-dNet}/${total} en vez de ${score}/${total}.</div>`;
  else verdict=`<div class="callout">Arriesgar y dejar en blanco las dudosas daba lo mismo en este intento.</div>`;
  const weak=Object.entries(miss).sort((a,b)=>b[1]-a[1]).map(([k,n])=>`${topicName(k)} (${n})`).join(', ');
  $app.innerHTML=`
  <div class="bar"><button class="btn" data-act="home">Inicio</button>
    <button class="btn primary" data-act="again">${typeof cur.key==='number'?'Repetir '+cur.title:'Otro parcial aleatorio'}</button></div>
  <div class="panel score">
    <span class="label">${cur.title} · factor −${f}</span>
    <div class="big">${score}<small> / ${total}</small></div>
    <div class="tiles">
      <div class="tile ok"><b>${ok}</b><small>correctas · +${ok*2}</small></div>
      <div class="tile bad"><b>${bad}</b><small>incorrectas · −${bad*f}</small></div>
      <div class="tile"><b>${blank}</b><small>en blanco · 0</small></div>
    </div>
    <div class="risk">
      <h3>¿Arriesgar o dejar en blanco?</h3>
      <p>Acertaste ${sure.ok} de ${sure.n} marcadas «Seguro» (${pct(sure)}) y ${doubt.ok} de ${doubt.n} marcadas «Dudo» (${pct(doubt)}).</p>
      ${verdict}
      <p>Con factor −${f} te conviene responder solo si estás al menos ${th} % seguro, o si puedes descartar opciones hasta llegar a ese punto. Adivinar a ciegas entre 4 opciones da en promedio ${(0.5-0.75*f).toFixed(2).replace('.',',')} pts por pregunta.</p>
      ${weak?`<p><b>Repasa:</b> ${weak}.</p>`:''}
    </div>
  </div>
  <h2>Revisión</h2>
  <div>${qs.map((q,i)=>review(q,i)).join('')}</div>`;
  scrollTo(0,0);
}
function review(q,i){
  const a=cur.ans[i],st=a==null?['blank','En blanco']:a===q.c?['ok','Correcta']:['bad','Incorrecta'];
  return`<div class="rv"><div class="rv-h"><b class="mono">${i+1}.</b><span class="st ${st[0]}">${st[1]}</span><span class="tag">${topicName(q.t)}</span></div>
  <div>${q.q}</div>
  <div class="opts" style="padding-left:0">${q.opts.map((o,j)=>`<div class="ro${j===q.c?' right':j===a?' wrong':''}"><span class="n">[ ${j+1} ]</span><span>${o}${j===q.c?' ✓':j===a?' (tu respuesta)':''}</span></div>`).join('')}</div>
  ${q.e?`<p class="why">${q.e}</p>`:''}</div>`;
}

function randomExam(){
  const pool=BANK.map((b,i)=>i).filter(i=>S.topics.includes(BANK[i][0]));
  start('r','Parcial aleatorio',mkQs(shuf(pool).slice(0,10)));
}

// ---------- eventos
$app.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const act=el.dataset.act,i=+el.dataset.i,v=el.dataset.v;
  if(act==='factor'){S.factor=+v;persist();home()}
  else if(act==='topic'){S.topics=el.checked?[...S.topics,v]:S.topics.filter(k=>k!==v);persist();
    document.querySelector('[data-act="random"]').disabled=!S.topics.length}
  else if(act==='random')randomExam();
  else if(act==='model'){const m=+v;start(m,'Modelo '+LETTERS[m],mkQs(MODELS[m],'o'+m+'-'))}
  else if(act==='home')home();
  else if(act==='again'){if(typeof cur.key==='number')start(cur.key,cur.title,mkQs(MODELS[cur.key],'o'+cur.key+'-'));else randomExam()}
  else if(act==='pick'){const j=+el.dataset.j;cur.ans[i]=cur.ans[i]===j?null:j;redraw(i)}
  else if(act==='conf'){cur.conf[i]=v;redraw(i)}
  else if(act==='blank'){cur.ans[i]=null;redraw(i)}
  else if(act==='grade')grade();
});
home();
</script>
